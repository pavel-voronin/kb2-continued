name: Release and web deployment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing DOS release tag to build and deploy the website
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'WEB/**'
    tags:
      - 'v[0-9]*'
      - 'V[0-9]*'

permissions:
  contents: write

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Check changelog extraction and early failure
        run: ./TEST/RELEASE.ps1
      - name: Build game and package official DOSBox-X
        id: portable
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./RELEASE/portable.ps1 -Tag $env:RELEASE_TAG -OutputDirectory "$env:RUNNER_TEMP/kb2-release"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PORTABLE_ARCHIVE: ${{ steps.portable.outputs.archive }}
          RELEASE_NOTES: ${{ steps.portable.outputs.notes }}
        run: |
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, $env:PORTABLE_ARCHIVE,
            '--verify-tag', '--draft', '--title', "KB2: Continued $env:RELEASE_TAG",
            '--notes-file', $env:RELEASE_NOTES)
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or ZIP upload failed.' }
          & gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
  notify-discord:
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Discord announcement
        run: node TEST/DISCORD.cjs
      - name: Announce the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --json tagName,url,isDraft > release.json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the published release.' }
          . ./RELEASE/changelog.ps1
          $env:RELEASE_CHANGES = Get-ReleaseChanges -Path ./CHANGELOG.md -Tag $env:RELEASE_TAG
          node RELEASE/discord.cjs release.json
          if ($LASTEXITCODE -ne 0) { throw 'Discord announcement failed.' }
  deploy-web:
    needs: portable
    if: >-
      !cancelled() && vars.KB2_DEPLOY_ENABLED == 'true' &&
      (needs.portable.result == 'success' || github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: kb2-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: WEB/package-lock.json
      - name: Install web packager
        run: npm ci --prefix WEB --ignore-scripts --no-audit --no-fund
      - name: Check web release packaging
        run: node TEST/WEB.cjs
      - name: Download the published DOS game
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            RELEASE_TAG=$(gh release view --json tagName --jq .tagName)
            printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
          fi
          [[ "$RELEASE_TAG" =~ ^[vV][0-9]+(\.[0-9]+){0,2}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || exit 1
          gh release download "$RELEASE_TAG" --pattern "KB2-continued-$RELEASE_TAG-win64-portable.zip" --dir "$RUNNER_TEMP/kb2-release"
          unzip -q "$RUNNER_TEMP/kb2-release/KB2-continued-$RELEASE_TAG-win64-portable.zip" 'GAME/*' -d "$RUNNER_TEMP/kb2-web-input"
      - name: Build the website for deployment
        run: |
          set -euo pipefail
          node WEB/build.cjs --game-dir "$RUNNER_TEMP/kb2-web-input/GAME" --tag "$RELEASE_TAG"
          mkdir web-artifact
          tar -czf "web-artifact/KB2-web-$RELEASE_TAG.tar.gz" -C WEB/dist .
      - name: Connect to the private deployment network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.KB2_TS_CLIENT_ID }}
          audience: ${{ vars.KB2_TS_AUDIENCE }}
          tags: tag:kb2-ci
          ping: ${{ vars.KB2_SSH_HOST }}
      - name: Deploy the published release
        env:
          KB2_SSH_HOST: ${{ vars.KB2_SSH_HOST }}
          KB2_SSH_USER: ${{ vars.KB2_SSH_USER }}
          KB2_SSH_PORT: ${{ vars.KB2_SSH_PORT }}
          KB2_DEPLOY_KEY: ${{ secrets.KB2_DEPLOY_KEY }}
          KB2_SSH_KNOWN_HOSTS: ${{ secrets.KB2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${KB2_SSH_HOST:?Set repository variable KB2_SSH_HOST}"
          : "${KB2_SSH_USER:?Set repository variable KB2_SSH_USER}"
          : "${KB2_DEPLOY_KEY:?Set repository secret KB2_DEPLOY_KEY}"
          : "${KB2_SSH_KNOWN_HOSTS:?Set repository secret KB2_SSH_KNOWN_HOSTS}"
          [[ "$RELEASE_TAG" =~ ^[vV][0-9]+(\.[0-9]+){0,2}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || exit 1
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' "$KB2_DEPLOY_KEY" > "$work/key"
          printf '%s\n' "$KB2_SSH_KNOWN_HOSTS" > "$work/known_hosts"
          chmod 600 "$work/key" "$work/known_hosts"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" \
              -i "$work/key" -p "${KB2_SSH_PORT:-22}" "$KB2_SSH_USER@$KB2_SSH_HOST" \
              "release $RELEASE_TAG" < "web-artifact/KB2-web-$RELEASE_TAG.tar.gz"
