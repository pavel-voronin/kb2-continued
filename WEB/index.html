<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>King's Bounty 2 — Продолжение</title>
  <link rel="preload" href="vendor/wdosbox-x.wasm?v={{RUNTIME_REV}}" as="fetch" type="application/wasm" crossorigin>
  <link rel="preload" href="vendor/wdosbox-x.js?v={{RUNTIME_REV}}" as="fetch" crossorigin>
  <style>#player:not(.ui-ready) { visibility: hidden; }</style>

  <script src="changelog.js?v={{ASSET_REV}}" defer></script>

<body>
  <div id="page-layout">
  <main id="player" aria-label="Игра">
    <div class="toolbar">
      <div class="versions" role="group" aria-label="Версия игры">
        <select id="mode" aria-label="Версия игры">
          <option value="classic">kb2: классика</option>
          <option value="continued" selected>kb2: продолжение</option>

        <button id="release" hidden title="История изменений «Продолжения»"></button>
      </div>

        <button id="fullscreen" title="Развернуть (F11)" aria-label="Развернуть"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 2H2v4m8-4h4v4M2 10v4h4m8-4v4h-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <button id="sound" aria-pressed="false">Звук: выкл.</button>
        <a href="https://discord.gg/ausmfCeyP" target="_blank" rel="noopener noreferrer">Discord</a>
        <a id="github" href="https://github.com/pavel-voronin/kb2-continued" target="_blank" rel="noopener noreferrer" title="Репозиторий на GitHub" aria-label="Репозиторий на GitHub"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 .297a12 12 0 0 0-3.793 23.385c.6.111.82-.261.82-.577v-2.234c-3.338.726-4.043-1.416-4.043-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.835 2.807 1.305 3.492.998.108-.776.418-1.305.762-1.605-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.536-1.524.117-3.176 0 0 1.008-.322 3.301 1.23a11.52 11.52 0 0 1 6.006 0c2.291-1.552 3.297-1.23 3.297-1.23.655 1.652.243 2.873.119 3.176.77.84 1.235 1.91 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.216.694.825.576A12 12 0 0 0 12 .297Z"/></svg></a>
      </div>
    </div>
    <div id="viewport">
      <div id="screen" tabindex="0" role="application" aria-label="Игра">
        <img id="startup-screen" src="{{STARTUP_IMAGE}}" width="600" height="330" alt="" decoding="sync" draggable="false">
        <canvas id="canvas" width="600" height="330"></canvas>
        <div id="loading" role="status"><span id="status">Загрузка…</span><button id="retry" hidden>Повторить запуск</button></div>
        <div id="changelog-dialog" role="dialog" aria-describedby="changelog-text" hidden>
          <canvas id="changelog-canvas" width="600" height="330" aria-hidden="true"></canvas>
          <button id="changelog-close" aria-label="Закрыть историю изменений"></button>
          <div id="changelog-text" class="changelog-text"></div>
        </div>
      </div>
    </div>
    <footer>© 1992–1993 Сергей Прокофьев<br>© 2026 Павел Воронин</footer>
  </main>
  </div>

</html>
